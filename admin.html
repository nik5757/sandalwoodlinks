<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sandalwood Links - Owner Admin Control Center</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap');
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #03060f;
            color: #f8fafc;
            background-image:
                radial-gradient(circle at 10% 10%, rgba(99, 102, 241, 0.15) 0%, transparent 40%),
                radial-gradient(circle at 90% 90%, rgba(16, 185, 129, 0.10) 0%, transparent 40%);
        }
        .font-mono-code { font-family: 'JetBrains Mono', monospace; }
        .glass-panel {
            background: linear-gradient(180deg, rgba(15, 23, 42, 0.85) 0%, rgba(8, 13, 26, 0.92) 100%);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 1.25rem;
            box-shadow: 0 14px 34px -12px rgba(0, 0, 0, 0.65);
        }
        .btn-primary { background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%); box-shadow: 0 8px 20px -4px rgba(99, 102, 241, 0.5); }
        .btn-emerald { background: linear-gradient(135deg, #10b981 0%, #059669 100%); box-shadow: 0 8px 20px -4px rgba(16, 185, 129, 0.45); }
        .btn-danger { background: linear-gradient(135deg, #f43f5e 0%, #e11d48 100%); box-shadow: 0 8px 20px -4px rgba(244, 63, 94, 0.45); }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #03060f; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 10px; }
        .tg-bubble { background-color: #182533; border-radius: 12px 12px 12px 2px; }
    </style>
</head>
<body class="flex h-screen overflow-hidden">

    <!-- TOAST NOTIFICATION -->
    <div id="admin-toast" class="fixed top-5 right-5 z-[100] pointer-events-none transition-all duration-300 opacity-0 -translate-y-3">
        <div class="bg-slate-900/95 border border-indigo-500/40 text-white px-4 py-3 rounded-xl shadow-2xl flex items-center space-x-2.5 backdrop-blur-xl">
            <i id="admin-toast-icon" class="fa-solid fa-circle-check text-emerald-400"></i>
            <span id="admin-toast-text" class="text-xs font-bold">Saved successfully</span>
        </div>
    </div>

    <!-- OWNER DOUBLE CONFIRMATION MODAL FOR DELETING ALL LINKS (CREATOR OR GLOBAL) -->
    <div id="admin-del-all-modal" class="fixed inset-0 z-[90] bg-black/85 backdrop-blur-md flex items-center justify-center hidden p-5">
        <div class="glass-panel p-6 max-w-sm w-full border border-rose-500/40 text-center">
            <div class="w-16 h-16 bg-rose-500/15 rounded-2xl mx-auto flex items-center justify-center mb-4 border border-rose-500/30">
                <i class="fa-solid fa-triangle-exclamation text-2xl text-rose-400"></i>
            </div>
            <span id="admin-del-step-badge" class="text-[10px] font-extrabold uppercase tracking-wider px-2.5 py-0.5 rounded-full bg-rose-500/20 text-rose-300 border border-rose-500/30">Owner Confirmation 1 of 2</span>
            <h3 id="admin-del-title" class="text-lg font-extrabold text-white mt-2 mb-1.5">Delete Links Permanently?</h3>
            <p id="admin-del-desc" class="text-xs text-slate-300 leading-relaxed mb-5">
                First Check: Are you sure you want to permanently delete these shortened links?
            </p>
            <div class="grid grid-cols-2 gap-3">
                <button onclick="closeAdminDeleteAllModal()" class="bg-slate-800 hover:bg-slate-700 text-slate-200 font-bold py-3 rounded-xl text-xs transition">Cancel</button>
                <button id="btn-admin-del-confirm" onclick="advanceAdminDeleteAll()" class="btn-danger text-white font-extrabold py-3 rounded-xl text-xs transition">Yes, Continue (1/2)</button>
            </div>
        </div>
    </div>

    <!-- LOGIN SCREEN -->
    <div id="login-screen" class="absolute inset-0 z-50 bg-[#03060f] flex items-center justify-center p-4">
        <div class="glass-panel p-8 max-w-sm w-full text-center border border-indigo-500/30">
            <div class="w-16 h-16 mx-auto btn-primary rounded-2xl flex items-center justify-center mb-5 shadow-xl">
                <i class="fa-solid fa-crown text-2xl text-white"></i>
            </div>
            <h2 class="text-2xl font-extrabold mb-1">Owner Control</h2>
            <p class="text-xs text-slate-400 mb-6">Sandalwood Links Infrastructure v3.0</p>
            <input type="password" id="admin-password" onkeydown="if(event.key==='Enter') document.getElementById('btn-login').click()" placeholder="Enter Owner Password" class="w-full bg-slate-950 border border-slate-800 text-white px-4 py-3.5 rounded-xl mb-4 focus:outline-none focus:border-indigo-500 text-center tracking-widest text-sm">
            <button id="btn-login" class="w-full btn-primary hover:opacity-95 text-white font-extrabold py-3.5 rounded-xl transition-all text-sm">Unlock Owner Panel</button>
        </div>
    </div>

    <!-- ADMIN DASHBOARD -->
    <div id="admin-dashboard" class="flex w-full h-full hidden">
        <!-- Desktop Sidebar -->
        <aside class="w-64 bg-slate-950/90 border-r border-slate-800/80 p-4 hidden md:flex flex-col">
            <div class="flex items-center space-x-3 px-2 mb-8 mt-1">
                <div class="w-9 h-9 rounded-xl btn-primary flex items-center justify-center">
                    <i class="fa-solid fa-crown text-white text-sm"></i>
                </div>
                <div>
                    <h1 class="text-sm font-extrabold text-white leading-none">Sandalwood</h1>
                    <span class="text-[10px] text-emerald-400 font-bold uppercase">Owner Panel v3</span>
                </div>
            </div>

            <nav class="space-y-1.5 flex-1 text-xs font-bold">
                <button class="nav-btn w-full text-left p-3 rounded-xl bg-indigo-600 text-white transition flex items-center" onclick="switchTab('dashboard', this)">
                    <i class="fa-solid fa-chart-pie mr-3 w-5 text-center"></i> Overview & Stats
                </button>
                <button class="nav-btn w-full text-left p-3 rounded-xl hover:bg-slate-900 text-slate-400 transition flex items-center" onclick="switchTab('users', this)">
                    <i class="fa-solid fa-users mr-3 w-5 text-center"></i> Creators & Users
                </button>
                <button class="nav-btn w-full text-left p-3 rounded-xl hover:bg-slate-900 text-slate-400 transition flex items-center" onclick="switchTab('links', this)">
                    <i class="fa-solid fa-link mr-3 w-5 text-center"></i> Links Manager
                </button>
                <button class="nav-btn w-full text-left p-3 rounded-xl hover:bg-slate-900 text-slate-400 transition flex items-center" onclick="switchTab('withdrawals', this)">
                    <i class="fa-solid fa-money-bill-transfer mr-3 w-5 text-center"></i> Payout Requests
                </button>
                <button class="nav-btn w-full text-left p-3 rounded-xl hover:bg-slate-900 text-slate-400 transition flex items-center" onclick="switchTab('settings', this)">
                    <i class="fa-solid fa-sliders mr-3 w-5 text-center text-emerald-400"></i> 1-20 Ads & CPM Setup
                </button>
                <button class="nav-btn w-full text-left p-3 rounded-xl hover:bg-slate-900 text-slate-400 transition flex items-center" onclick="switchTab('broadcast', this)">
                    <i class="fa-solid fa-bullhorn mr-3 w-5 text-center text-amber-400"></i> Bot Broadcast
                </button>
            </nav>

            <button class="w-full text-left p-3 rounded-xl hover:bg-rose-950/50 text-slate-400 hover:text-rose-400 transition text-xs font-bold flex items-center" onclick="location.reload()">
                <i class="fa-solid fa-power-off mr-3 w-5 text-center"></i> Lock Session
            </button>
        </aside>

        <!-- Mobile Header & Main -->
        <div class="md:hidden flex flex-col w-full h-full">
            <header class="flex flex-col bg-slate-950 p-3 border-b border-slate-800 space-y-2.5">
                <div class="flex justify-between items-center">
                    <span class="font-extrabold text-sm text-white"><i class="fa-solid fa-crown text-indigo-400 mr-1.5"></i>Sandalwood Owner</span>
                    <button onclick="location.reload()" class="text-xs text-rose-400 font-bold"><i class="fa-solid fa-power-off mr-1"></i>Lock</button>
                </div>
                <div class="flex space-x-1.5 text-xs font-bold overflow-x-auto whitespace-nowrap pb-1">
                    <button class="nav-btn bg-indigo-600 px-3 py-1.5 rounded-lg text-white" onclick="switchTab('dashboard', this)">Overview</button>
                    <button class="nav-btn text-slate-400 px-3 py-1.5 rounded-lg" onclick="switchTab('users', this)">Creators/Users</button>
                    <button class="nav-btn text-slate-400 px-3 py-1.5 rounded-lg" onclick="switchTab('links', this)">Links Manager</button>
                    <button class="nav-btn text-slate-400 px-3 py-1.5 rounded-lg" onclick="switchTab('withdrawals', this)">Payouts</button>
                    <button class="nav-btn text-slate-400 px-3 py-1.5 rounded-lg" onclick="switchTab('settings', this)">1-20 CPM</button>
                    <button class="nav-btn text-slate-400 px-3 py-1.5 rounded-lg" onclick="switchTab('broadcast', this)">Broadcast</button>
                </div>
            </header>
            <main id="mobile-main" class="flex-1 overflow-y-auto p-4"></main>
        </div>

        <!-- Desktop Main -->
        <main id="desktop-main" class="hidden md:block flex-1 p-8 overflow-y-auto"></main>
    </div>

    <!-- ============================================== -->
    <!-- TEMPLATES FOR TABS                             -->
    <!-- ============================================== -->

    <!-- TAB 1: DASHBOARD & ANALYTICS -->
    <template id="tpl-dashboard">
        <div class="flex flex-wrap justify-between items-center gap-4 mb-6">
            <div>
                <h2 class="text-2xl font-extrabold text-white">Owner Command Center</h2>
                <p class="text-xs text-slate-400">Live metrics across creators, normal users, links, views & payouts</p>
            </div>
            <button onclick="loadDashboard()" class="bg-slate-800 hover:bg-slate-700 text-xs font-bold px-4 py-2.5 rounded-xl border border-slate-700 transition">
                <i class="fa-solid fa-rotate mr-1.5 text-indigo-400"></i> Refresh Live Data
            </button>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4 mb-6">
            <div class="glass-panel p-5 border-l-4 border-l-indigo-500 flex justify-between items-center">
                <div><div class="text-slate-400 text-[11px] font-bold uppercase mb-1">Total Registered</div><div class="text-2xl font-extrabold text-white font-mono-code" id="stat-total-users">0</div></div>
                <div class="bg-indigo-500/15 p-3 rounded-xl"><i class="fa-solid fa-users text-indigo-400 text-lg"></i></div>
            </div>
            <div class="glass-panel p-5 border-l-4 border-l-emerald-500 flex justify-between items-center">
                <div><div class="text-slate-400 text-[11px] font-bold uppercase mb-1">Active Viewers Today</div><div class="text-2xl font-extrabold text-white font-mono-code" id="stat-active-users">0</div></div>
                <div class="bg-emerald-500/15 p-3 rounded-xl"><i class="fa-solid fa-bolt text-emerald-400 text-lg"></i></div>
            </div>
            <div class="glass-panel p-5 border-l-4 border-l-sky-500 flex justify-between items-center">
                <div><div class="text-slate-400 text-[11px] font-bold uppercase mb-1">Total Short Links</div><div class="text-2xl font-extrabold text-white font-mono-code" id="stat-total-links">0</div></div>
                <div class="bg-sky-500/15 p-3 rounded-xl"><i class="fa-solid fa-link text-sky-400 text-lg"></i></div>
            </div>
            <div class="glass-panel p-5 border-l-4 border-l-purple-500 flex justify-between items-center">
                <div><div class="text-slate-400 text-[11px] font-bold uppercase mb-1">Active Ad / CPM Tier</div><div class="text-2xl font-extrabold text-emerald-400 font-mono-code" id="stat-active-cpm">$1.00</div></div>
                <div class="bg-purple-500/15 p-3 rounded-xl"><i class="fa-solid fa-sliders text-purple-400 text-lg"></i></div>
            </div>
            <div class="glass-panel p-5 border-l-4 border-l-green-500 flex justify-between items-center">
                <div><div class="text-slate-400 text-[11px] font-bold uppercase mb-1">Approved Payouts</div><div class="text-2xl font-extrabold text-green-400 font-mono-code" id="stat-paid">$0.00</div></div>
                <div class="bg-green-500/15 p-3 rounded-xl"><i class="fa-solid fa-check-double text-green-400 text-lg"></i></div>
            </div>
            <div class="glass-panel p-5 border-l-4 border-l-amber-500 flex justify-between items-center">
                <div><div class="text-slate-400 text-[11px] font-bold uppercase mb-1">Pending Payouts</div><div class="text-2xl font-extrabold text-amber-400 font-mono-code" id="stat-pending-amt">$0.00</div></div>
                <div class="bg-amber-500/15 p-3 rounded-xl"><i class="fa-solid fa-clock text-amber-400 text-lg"></i></div>
            </div>
            <div class="glass-panel p-5 border-l-4 border-l-cyan-500 flex justify-between items-center">
                <div><div class="text-slate-400 text-[11px] font-bold uppercase mb-1">Total Verified Clicks</div><div class="text-2xl font-extrabold text-cyan-400 font-mono-code" id="stat-total-clicks">0</div></div>
                <div class="bg-cyan-500/15 p-3 rounded-xl"><i class="fa-solid fa-eye text-cyan-400 text-lg"></i></div>
            </div>
            <div class="glass-panel p-5 border-l-4 border-l-rose-500 flex justify-between items-center">
                <div><div class="text-slate-400 text-[11px] font-bold uppercase mb-1">Suspended Accounts</div><div class="text-2xl font-extrabold text-rose-400 font-mono-code" id="stat-blocked">0</div></div>
                <div class="bg-rose-500/15 p-3 rounded-xl"><i class="fa-solid fa-ban text-rose-400 text-lg"></i></div>
            </div>
        </div>

        <div class="glass-panel p-6">
            <div class="flex flex-wrap justify-between items-center gap-3 mb-4 pb-3 border-b border-slate-800">
                <div>
                    <h3 class="text-sm font-extrabold text-white uppercase tracking-wider"><i class="fa-solid fa-chart-column text-indigo-400 mr-2"></i>Platform Traffic Archive (Last 6 Months)</h3>
                    <p class="text-xs text-slate-400">Aggregated verified clicks across all links by month</p>
                </div>
            </div>
            <div id="admin-monthly-report" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-3">
                <div class="text-slate-500 text-xs py-4">Calculating monthly archive...</div>
            </div>
        </div>
    </template>

    <!-- TAB 2: CREATORS & USERS (2 OPTIONS: CREATORS vs NORMAL USERS) -->
    <template id="tpl-users">
        <div class="flex flex-wrap justify-between items-center gap-4 mb-5">
            <div>
                <h2 class="text-2xl font-extrabold text-white">Creators & Users Directory</h2>
                <p class="text-xs text-slate-400">Separate view for Creators (converted ≥ 1 link) and Normal Users (link openers)</p>
            </div>
            <input type="text" id="admin-user-search" oninput="filterAdminUsers()" placeholder="Search name, @username, TG ID or API..." class="bg-slate-900 border border-slate-700 text-white rounded-xl px-4 py-2.5 text-xs focus:outline-none focus:border-indigo-500 w-full sm:w-72">
        </div>

        <!-- 2 OPTIONS TOGGLE: CREATORS vs USERS -->
        <div class="grid grid-cols-2 gap-3 mb-5 max-w-lg">
            <button id="btn-role-creators" onclick="setAdminUserRoleTab('creators')" class="p-3.5 rounded-2xl border border-indigo-500/50 bg-indigo-600/20 text-white text-left transition flex items-center justify-between">
                <div>
                    <div class="text-xs font-extrabold flex items-center"><i class="fa-solid fa-wand-magic-sparkles text-indigo-400 mr-2"></i>Creators</div>
                    <div class="text-[10px] text-slate-300 mt-0.5">Converted ≥ 1 Link (API Unlocked)</div>
                </div>
                <span id="badge-count-creators" class="bg-indigo-500 text-white font-mono-code text-xs font-extrabold px-2.5 py-1 rounded-xl">0</span>
            </button>

            <button id="btn-role-users" onclick="setAdminUserRoleTab('users')" class="p-3.5 rounded-2xl border border-slate-800 bg-slate-900/60 text-slate-400 hover:text-white text-left transition flex items-center justify-between">
                <div>
                    <div class="text-xs font-extrabold flex items-center"><i class="fa-solid fa-user text-emerald-400 mr-2"></i>Users</div>
                    <div class="text-[10px] text-slate-400 mt-0.5">Link Openers (0 Links Converted)</div>
                </div>
                <span id="badge-count-users" class="bg-slate-800 text-slate-300 font-mono-code text-xs font-extrabold px-2.5 py-1 rounded-xl">0</span>
            </button>
        </div>

        <div class="glass-panel overflow-x-auto">
            <table class="w-full text-left text-xs whitespace-nowrap">
                <thead class="bg-slate-950/90 text-slate-400 border-b border-slate-800 uppercase">
                    <tr>
                        <th class="p-4">TG ID & Name</th>
                        <th class="p-4">Links Converted</th>
                        <th class="p-4">Permanent API Key</th>
                        <th class="p-4">Total Views</th>
                        <th class="p-4">Wallet Balance</th>
                        <th class="p-4">Status</th>
                        <th class="p-4 text-right">Owner Actions</th>
                    </tr>
                </thead>
                <tbody id="admin-users-list" class="divide-y divide-slate-800/80">
                    <tr><td colspan="7" class="p-8 text-center text-slate-400"><i class="fa-solid fa-circle-notch fa-spin mr-2"></i> Loading directory...</td></tr>
                </tbody>
            </table>
        </div>
    </template>

    <!-- TAB 3: LINKS MANAGER (GROUPED BY CREATOR NAME -> CLICK CREATOR TO VIEW & DELETE LINKS) -->
    <template id="tpl-links">
        <!-- VIEW A: CREATORS LIST IN LINKS MANAGER -->
        <div id="links-manager-creators-view">
            <div class="flex flex-wrap justify-between items-center gap-4 mb-6">
                <div>
                    <h2 class="text-2xl font-extrabold text-white">Links Manager — Select Creator</h2>
                    <p class="text-xs text-slate-400">Click on any Creator's name below to inspect or permanently delete their shortened links</p>
                </div>
                <div class="flex flex-wrap items-center gap-2.5">
                    <input type="text" id="admin-creator-link-search" oninput="renderLinksManagerCreators()" placeholder="Search creator name or TG ID..." class="bg-slate-900 border border-slate-700 text-white rounded-xl px-4 py-2.5 text-xs focus:outline-none focus:border-indigo-500 w-64">
                    <button onclick="openOwnerDeleteModal('global')" class="btn-danger text-white font-extrabold px-4 py-2.5 rounded-xl text-xs transition flex items-center">
                        <i class="fa-solid fa-trash-can mr-1.5"></i> Delete All Platform Links
                    </button>
                </div>
            </div>

            <div id="links-creators-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                <div class="col-span-full text-center p-10 text-slate-400 text-xs"><i class="fa-solid fa-circle-notch fa-spin mr-2"></i> Loading creators...</div>
            </div>
        </div>

        <!-- VIEW B: SELECTED CREATOR'S LINKS TABLE -->
        <div id="links-manager-detail-view" class="hidden">
            <div class="flex flex-wrap justify-between items-center gap-4 mb-6">
                <div class="flex items-center space-x-3">
                    <button onclick="backToLinksCreatorsList()" class="bg-slate-800 hover:bg-slate-700 text-white px-3.5 py-2.5 rounded-xl text-xs font-extrabold border border-slate-700 transition flex items-center">
                        <i class="fa-solid fa-arrow-left mr-1.5"></i> Back to Creators
                    </button>
                    <div>
                        <h2 id="selected-creator-title" class="text-xl font-extrabold text-white">Creator's Links</h2>
                        <p id="selected-creator-subtitle" class="text-xs text-indigo-400 font-mono-code">TG ID: ...</p>
                    </div>
                </div>
                <div class="flex flex-wrap items-center gap-2.5">
                    <input type="text" id="admin-link-search" oninput="filterSelectedCreatorLinks()" placeholder="Search short code or URL..." class="bg-slate-900 border border-slate-700 text-white rounded-xl px-4 py-2.5 text-xs focus:outline-none focus:border-indigo-500 w-60">
                    <button onclick="openOwnerDeleteModal('creator')" class="btn-danger text-white font-extrabold px-4 py-2.5 rounded-xl text-xs transition flex items-center">
                        <i class="fa-solid fa-trash-can mr-1.5"></i> Delete All Links of This Creator
                    </button>
                </div>
            </div>

            <div class="glass-panel overflow-x-auto">
                <table class="w-full text-left text-xs whitespace-nowrap">
                    <thead class="bg-slate-950/90 text-slate-400 border-b border-slate-800 uppercase">
                        <tr>
                            <th class="p-4">Short ID</th>
                            <th class="p-4">Destination URL</th>
                            <th class="p-4">Views</th>
                            <th class="p-4">Earnings</th>
                            <th class="p-4">Created</th>
                            <th class="p-4 text-right">Owner Permanent Delete</th>
                        </tr>
                    </thead>
                    <tbody id="admin-links-list" class="divide-y divide-slate-800/80">
                    </tbody>
                </table>
            </div>
        </div>
    </template>

    <!-- TAB 4: WITHDRAWALS -->
    <template id="tpl-withdrawals">
        <div class="flex flex-wrap justify-between items-center gap-4 mb-6">
            <div>
                <h2 class="text-2xl font-extrabold text-white">Withdrawal Requests</h2>
                <p class="text-xs text-slate-400">Approve payouts or reject to automatically refund user balance</p>
            </div>
            <select id="admin-withdraw-filter" onchange="loadWithdrawals()" class="bg-slate-900 border border-slate-700 text-white rounded-xl px-4 py-2.5 text-xs focus:outline-none">
                <option value="all">All Requests</option>
                <option value="pending">Pending Only</option>
                <option value="approved">Approved Only</option>
                <option value="rejected">Rejected / Refunded</option>
            </select>
        </div>
        <div class="glass-panel overflow-x-auto">
            <table class="w-full text-left text-xs whitespace-nowrap">
                <thead class="bg-slate-950/90 text-slate-400 border-b border-slate-800 uppercase">
                    <tr>
                        <th class="p-4">Creator</th>
                        <th class="p-4">Method & Payout Details</th>
                        <th class="p-4">Amount</th>
                        <th class="p-4">Date</th>
                        <th class="p-4 text-center">Status / Action</th>
                    </tr>
                </thead>
                <tbody id="admin-withdraw-list" class="divide-y divide-slate-800/80">
                    <tr><td colspan="5" class="p-8 text-center text-slate-400"><i class="fa-solid fa-circle-notch fa-spin mr-2"></i> Loading requests...</td></tr>
                </tbody>
            </table>
        </div>
    </template>

    <!-- TAB 5: SETTINGS (AUTOMATIC 1-TO-20 ADS = $1-TO-$20 CPM SYNCHRONIZER) -->
    <template id="tpl-settings">
        <div class="flex flex-wrap justify-between items-center gap-4 mb-6">
            <div>
                <h2 class="text-2xl font-extrabold text-white">1–20 Ads & Automatic CPM Configuration</h2>

    <script>
        const SUPABASE_URL = 'https://xywqcplbdcmyhsvdccwk.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_8eRTa4Dm5RzCBV0d3ZHRVA_GxMw4g68';
        const VERCEL_BROADCAST_API = 'https://sandalwoodlinks.vercel.app/api/broadcast';
        const ADMIN_PASSWORD = "Admin3";

        let dbClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        let settingsId = null;

        let allAdminUsers = [];
        let allAdminLinks = [];
        let userLinksCountMap = {}; // user_id -> number of links converted
        let currentAdminUserRoleTab = 'creators'; // 'creators' (>=1 link) | 'users' (0 links)

        // Links Manager State
        let selectedCreatorForLinks = null; // user object when viewing a creator's links
        let pendingAdminLinkDeleteId = null;
        let adminDeleteAllStep = 0;
        let adminDeleteMode = 'global'; // 'global' | 'creator'

        function generatePermanentUserApiKey(telegramId, userId) {
            const s = `sandalwood_perm_${telegramId || userId || 'creator'}_v3`;
            let h1 = 0xdeadbeef ^ s.length, h2 = 0x41c6ce57 ^ s.length;
            for (let i = 0, ch; i < s.length; i++) {
                ch = s.charCodeAt(i);
                h1 = Math.imul(h1 ^ ch, 2654435761);
                h2 = Math.imul(h2 ^ ch, 1597334677);
            }
            h1 = Math.imul(h1 ^ (h1 >>> 16), 2246822507) ^ Math.imul(h2 ^ (h2 >>> 13), 3266489909);
            h2 = Math.imul(h2 ^ (h2 >>> 16), 2246822507) ^ Math.imul(h1 ^ (h1 >>> 13), 3266489909);
            return `sw_${telegramId || 'u'}_${(h2 >>> 0).toString(16).padStart(8, '0') + (h1 >>> 0).toString(16).padStart(8, '0')}`;
        }

        function showAdminToast(msg, isError = false) {
            const box = document.getElementById('admin-toast');
            document.getElementById('admin-toast-text').innerText = msg;
            document.getElementById('admin-toast-icon').className = isError ? 'fa-solid fa-circle-exclamation text-rose-400' : 'fa-solid fa-circle-check text-emerald-400';
            box.classList.remove('opacity-0', '-translate-y-3');
            setTimeout(() => box.classList.add('opacity-0', '-translate-y-3'), 2600);
        }

        function copyAdminText(txt) {
            if (!txt) return;
            navigator.clipboard?.writeText(txt).then(() => showAdminToast("Copied to clipboard!"));
        }

        document.getElementById('btn-login').addEventListener('click', () => {
            if (document.getElementById('admin-password').value === ADMIN_PASSWORD) {
                document.getElementById('login-screen').classList.add('hidden');
                document.getElementById('admin-dashboard').classList.remove('hidden');
                switchTab('dashboard', document.querySelector('.nav-btn'));
            } else {
                showAdminToast("Incorrect Owner Password!", true);
            }
        });

        function getActiveMain() {
            return window.innerWidth < 768 ? document.getElementById('mobile-main') : document.getElementById('desktop-main');
        }

        window.switchTab = function(tabName, btnEl) {
            document.querySelectorAll('.nav-btn').forEach(b => {
                b.classList.remove('bg-indigo-600', 'text-white');
                b.classList.add('text-slate-400');
            });
            if (btnEl) {
                btnEl.classList.remove('text-slate-400');
                btnEl.classList.add('bg-indigo-600', 'text-white');
            }

            const mainContent = getActiveMain();
            mainContent.innerHTML = document.getElementById(`tpl-${tabName}`).innerHTML;

            if (tabName === 'dashboard') loadDashboard();
            if (tabName === 'users') loadUsers();
            if (tabName === 'links') loadAdminLinks();
            if (tabName === 'withdrawals') loadWithdrawals();
            if (tabName === 'settings') loadSettings();
            if (tabName === 'broadcast') updatePreview();
        };

        // --- TAB 1: DASHBOARD & MONTHLY ARCHIVE ---
        async function loadDashboard() {
            try {
                const { count: uCount } = await dbClient.from('users').select('*', { count: 'exact', head: true });
                document.getElementById('stat-total-users').innerText = uCount || 0;

                const { count: bCount } = await dbClient.from('users').select('*', { count: 'exact', head: true }).eq('is_blocked', true);
                document.getElementById('stat-blocked').innerText = bCount || 0;

                const { count: lCount } = await dbClient.from('links').select('*', { count: 'exact', head: true });
                document.getElementById('stat-total-links').innerText = lCount || 0;

                const { count: cCount } = await dbClient.from('click_logs').select('*', { count: 'exact', head: true });
                document.getElementById('stat-total-clicks').innerText = cCount || 0;

                const today = new Date().toISOString().split('T')[0];
                const { data: activeData } = await dbClient.from('click_logs').select('clicker_tg_id').gte('created_at', today);
                const uniqueActive = new Set(activeData?.map(d => d.clicker_tg_id)).size;
                document.getElementById('stat-active-users').innerText = uniqueActive || 0;

                const { data: setRow } = await dbClient.from('settings').select('ads_per_link, cpm').limit(1);
                const activeTier = Math.max(1, Math.min(20, parseInt(setRow?.[0]?.ads_per_link || setRow?.[0]?.cpm || 1, 10)));
                document.getElementById('stat-active-cpm').innerText = `${activeTier} Ads ($${activeTier}.00)`;

                const { data: wData } = await dbClient.from('withdrawals').select('amount, status');
                let paid = 0, pending = 0;
                (wData || []).forEach(w => {
                    if (w.status === 'approved') paid += parseFloat(w.amount || 0);
                    if (w.status === 'pending') pending += parseFloat(w.amount || 0);
                });
                document.getElementById('stat-paid').innerText = `$${paid.toFixed(2)}`;
                document.getElementById('stat-pending-amt').innerText = `$${pending.toFixed(2)}`;

                const sixMonthsAgo = new Date(new Date().getFullYear(), new Date().getMonth() - 5, 1).toISOString();
                const { data: clicksArchive } = await dbClient.from('click_logs').select('created_at').gte('created_at', sixMonthsAgo);
                let monthCounts = {};
                (clicksArchive || []).forEach(c => {
                    const d = new Date(c.created_at);
                    const ym = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`;
                    monthCounts[ym] = (monthCounts[ym] || 0) + 1;
                });

                const reportContainer = document.getElementById('admin-monthly-report');
                if (reportContainer) {
                    reportContainer.innerHTML = '';
                    for (let i = 0; i < 6; i++) {
                        const d = new Date(new Date().getFullYear(), new Date().getMonth() - i, 1);
                        const ym = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`;
                        const monthName = d.toLocaleString('default', { month: 'long', year: 'numeric' });
                        const views = monthCounts[ym] || 0;
                        const estPayout = views * (activeTier / 1000);
                        reportContainer.innerHTML += `
                            <div class="bg-slate-900/90 border border-slate-800 p-4 rounded-xl flex justify-between items-center">
                                <div>
                                    <div class="text-xs font-extrabold text-white">${monthName}</div>
                                    <div class="text-[11px] text-slate-400 mt-0.5">${views} verified views</div>
                                </div>
                                <div class="text-right">
                                    <div class="text-sm font-extrabold text-emerald-400 font-mono-code">$${estPayout.toFixed(4)}</div>
                                    <span class="text-[9px] text-slate-500 font-mono-code">${ym}</span>
                                </div>
                            </div>`;
                    }
                }
            } catch (e) {}
        }

        // --- TAB 2: CREATORS (CONVERTED >= 1 LINK) vs USERS (OPENERS / 0 LINKS) ---
        async function loadUsers() {
            const tbody = document.getElementById('admin-users-list');
            try {
                const [{ data: usersData }, { data: linksData }] = await Promise.all([
                    dbClient.from('users').select('*').order('created_at', { ascending: false }),
                    dbClient.from('links').select('id, user_id')
                ]);

                allAdminUsers = usersData || [];
                userLinksCountMap = {};
                (linksData || []).forEach(l => {
                    userLinksCountMap[l.user_id] = (userLinksCountMap[l.user_id] || 0) + 1;
                });

                // Ensure any Creator with >= 1 link has their permanent API key unlocked, and normal users with 0 links have no API key
                for (const u of allAdminUsers) {
                    const cnt = userLinksCountMap[u.id] || 0;
                    if (cnt >= 1 && !u.api_key) {
                        const newKey = generatePermanentUserApiKey(u.telegram_id, u.id);
                        u.api_key = newKey;
                        await dbClient.from('users').update({ api_key: newKey }).eq('id', u.id);
                    }
                }

                updateRoleCountsUI();
                filterAdminUsers();
            } catch (e) {}
        }

        function updateRoleCountsUI() {
            const creatorsCount = allAdminUsers.filter(u => (userLinksCountMap[u.id] || 0) >= 1).length;
            const normalUsersCount = allAdminUsers.filter(u => (userLinksCountMap[u.id] || 0) === 0).length;
            const cBadge = document.getElementById('badge-count-creators');
            const uBadge = document.getElementById('badge-count-users');
            if (cBadge) cBadge.innerText = creatorsCount;
            if (uBadge) uBadge.innerText = normalUsersCount;
        }

        window.setAdminUserRoleTab = function(role) {
            currentAdminUserRoleTab = role;
            const btnC = document.getElementById('btn-role-creators');
            const btnU = document.getElementById('btn-role-users');
            if (role === 'creators') {
                btnC.className = "p-3.5 rounded-2xl border border-indigo-500/50 bg-indigo-600/20 text-white text-left transition flex items-center justify-between";
                btnU.className = "p-3.5 rounded-2xl border border-slate-800 bg-slate-900/60 text-slate-400 hover:text-white text-left transition flex items-center justify-between";
            } else {
                btnU.className = "p-3.5 rounded-2xl border border-emerald-500/50 bg-emerald-600/20 text-white text-left transition flex items-center justify-between";
                btnC.className = "p-3.5 rounded-2xl border border-slate-800 bg-slate-900/60 text-slate-400 hover:text-white text-left transition flex items-center justify-between";
            }
            filterAdminUsers();
        };

        window.filterAdminUsers = function() {
            const q = (document.getElementById('admin-user-search')?.value || '').toLowerCase();
            const roleFiltered = allAdminUsers.filter(u => {
                const linkCount = userLinksCountMap[u.id] || 0;
                return currentAdminUserRoleTab === 'creators' ? linkCount >= 1 : linkCount === 0;
            });

            const searchFiltered = roleFiltered.filter(u =>
                String(u.telegram_id || '').includes(q) ||
                (u.first_name || '').toLowerCase().includes(q) ||
                (u.username || '').toLowerCase().includes(q) ||
                (u.api_key || '').toLowerCase().includes(q)
            );
            renderAdminUsers(searchFiltered);
        };

        function renderAdminUsers(usersArr) {
            const tbody = document.getElementById('admin-users-list');
            if (!usersArr || usersArr.length === 0) {
                const emptyLabel = currentAdminUserRoleTab === 'creators'
                    ? 'No Creators found (users who converted minimum 1 link).'
                    : 'No Normal Users found (users with 0 converted links).';
                tbody.innerHTML = `<tr><td colspan="7" class="p-8 text-center text-slate-500">${emptyLabel}</td></tr>`;
                return;
            }
            tbody.innerHTML = '';
            usersArr.forEach(u => {
                const linkCnt = userLinksCountMap[u.id] || 0;
                const statusBadge = u.is_blocked
                    ? '<span class="bg-rose-500/15 text-rose-400 border border-rose-500/30 px-2.5 py-0.5 rounded-md font-bold text-[10px]">SUSPENDED</span>'
                    : '<span class="bg-emerald-500/15 text-emerald-400 border border-emerald-500/30 px-2.5 py-0.5 rounded-md font-bold text-[10px]">ACTIVE</span>';
                const blockBtn = u.is_blocked
                    ? `<button onclick="toggleBlock('${u.id}', false)" class="bg-emerald-500/20 hover:bg-emerald-500/30 text-emerald-300 px-2.5 py-1.5 rounded-lg text-xs font-bold" title="Unblock"><i class="fa-solid fa-unlock"></i></button>`
                    : `<button onclick="toggleBlock('${u.id}', true)" class="bg-amber-500/20 hover:bg-amber-500/30 text-amber-300 px-2.5 py-1.5 rounded-lg text-xs font-bold" title="Suspend"><i class="fa-solid fa-ban"></i></button>`;

                const apiDisplay = linkCnt >= 1 && u.api_key
                    ? `<div class="flex items-center space-x-2">
                           <span class="font-mono-code text-[11px] text-amber-300 bg-slate-950 px-2.5 py-1 rounded-lg border border-slate-800">${u.api_key}</span>
                           <button onclick="copyAdminText('${u.api_key}')" class="text-slate-400 hover:text-white"><i class="fa-regular fa-copy"></i></button>
                       </div>`
                    : `<span class="text-[10px] text-slate-500 font-bold bg-slate-900 px-2.5 py-1 rounded-lg border border-slate-800"><i class="fa-solid fa-lock mr-1"></i>No API (Normal User)</span>`;

                tbody.innerHTML += `
                    <tr class="hover:bg-slate-900/50">
                        <td class="p-4">
                            <div class="font-bold text-white">${u.first_name || 'User'} ${u.username ? `<span class="text-slate-400 font-normal">@${u.username}</span>` : ''}</div>
                            <div class="text-[10px] font-mono-code text-indigo-400">TG ID: ${u.telegram_id}</div>
                        </td>
                        <td class="p-4">
                            <span class="font-mono-code font-extrabold ${linkCnt >= 1 ? 'text-indigo-300 bg-indigo-500/15 border-indigo-500/30' : 'text-slate-500 bg-slate-900 border-slate-800'} border px-2.5 py-1 rounded-lg text-xs">
                                ${linkCnt} ${linkCnt === 1 ? 'Link' : 'Links'}
                            </span>
                        </td>
                        <td class="p-4">${apiDisplay}</td>
                        <td class="p-4 font-mono-code font-bold text-slate-200">${u.total_clicks || 0}</td>
                        <td class="p-4">
                            <div class="flex items-center space-x-2">
                                <span class="font-mono-code font-extrabold text-emerald-400">$${parseFloat(u.balance || 0).toFixed(4)}</span>
                                <button onclick="editUserBalance('${u.id}', ${parseFloat(u.balance || 0)})" class="text-slate-400 hover:text-indigo-400" title="Edit Balance"><i class="fa-solid fa-pen-to-square"></i></button>
                            </div>
                        </td>
                        <td class="p-4">${statusBadge}</td>
                        <td class="p-4 text-right space-x-1.5">
                            ${linkCnt >= 1 ? `<button onclick="jumpToCreatorLinks('${u.id}')" class="bg-indigo-500/20 hover:bg-indigo-500/30 text-indigo-300 px-2.5 py-1.5 rounded-lg text-xs font-bold" title="View Creator Links"><i class="fa-solid fa-link mr-1"></i>Links</button>` : ''}
                            ${blockBtn}
                            <button onclick="deleteUser('${u.id}')" class="bg-rose-500/20 hover:bg-rose-500/30 text-rose-400 px-2.5 py-1.5 rounded-lg text-xs font-bold" title="Delete Permanently"><i class="fa-solid fa-trash-can"></i></button>
                        </td>
                    </tr>`;
            });
        }

        window.jumpToCreatorLinks = async function(userId) {
            const navBtn = Array.from(document.querySelectorAll('.nav-btn')).find(b => b.getAttribute('onclick')?.includes("'links'"));
            switchTab('links', navBtn);
            await loadAdminLinks();
            openCreatorLinksView(userId);
        };

        window.editUserBalance = async function(userId, currentBal) {
            const input = prompt("Enter new wallet balance ($) for this user:", currentBal);
            if (input === null) return;
            const newBal = parseFloat(input);
            if (isNaN(newBal) || newBal < 0) return showAdminToast("Invalid balance amount!", true);
            await dbClient.from('users').update({ balance: newBal }).eq('id', userId);
            showAdminToast("User balance updated!");
            loadUsers();
        };

        window.toggleBlock = async function(userId, blockStatus) {
            if (!confirm(`Confirm ${blockStatus ? 'SUSPEND' : 'ACTIVATE'} this account?`)) return;
            await dbClient.from('users').update({ is_blocked: blockStatus }).eq('id', userId);
            showAdminToast(blockStatus ? "Account suspended" : "Account activated");
            loadUsers();
        };

        window.deleteUser = async function(userId) {
            if (!confirm("WARNING: Permanently delete this account and all associated links?")) return;
            try {
                const { data: uLinks } = await dbClient.from('links').select('id').eq('user_id', userId);
                if (uLinks && uLinks.length > 0) {
                    await dbClient.from('click_logs').delete().in('link_id', uLinks.map(l => l.id));
                    await dbClient.from('links').delete().eq('user_id', userId);
                }
                const { error } = await dbClient.from('users').delete().eq('id', userId);
                if (error) throw error;
                showAdminToast("Account permanently deleted!");
                loadUsers();
            } catch (e) {
                showAdminToast("Delete failed: " + e.message, true);
            }
        };

        // --- TAB 3: CREATOR-GROUPED LINKS MANAGER (SHOW CREATORS -> CLICK NAME -> VIEW & DELETE LINKS) ---
        async function loadAdminLinks() {
            try {
                const [{ data: usersData }, { data: linksData }] = await Promise.all([
                    dbClient.from('users').select('*').order('created_at', { ascending: false }),
                    dbClient.from('links').select('*').order('created_at', { ascending: false })
                ]);
                allAdminUsers = usersData || [];
                allAdminLinks = linksData || [];
                renderLinksManagerCreators();
            } catch (e) {}
        }

        window.renderLinksManagerCreators = function() {
            const grid = document.getElementById('links-creators-grid');
            if (!grid) return;
            const q = (document.getElementById('admin-creator-link-search')?.value || '').toLowerCase();

            // Group links by user_id
            const grouped = {};
            allAdminLinks.forEach(l => {
                if (!grouped[l.user_id]) grouped[l.user_id] = { count: 0, views: 0, earnings: 0 };
                grouped[l.user_id].count += 1;
                grouped[l.user_id].views += (l.clicks || 0);
                grouped[l.user_id].earnings += parseFloat(l.earnings || 0);
            });

            // Filter only Creators who have >= 1 link
            const creatorsWithLinks = allAdminUsers.filter(u => grouped[u.id] && grouped[u.id].count >= 1).filter(u =>
                (u.first_name || '').toLowerCase().includes(q) ||
                (u.username || '').toLowerCase().includes(q) ||
                String(u.telegram_id || '').includes(q)
            );

            if (creatorsWithLinks.length === 0) {
                grid.innerHTML = `<div class="col-span-full glass-panel p-10 text-center text-slate-500 text-xs">No creators with shortened links found.</div>`;
                return;
            }

            grid.innerHTML = '';
            creatorsWithLinks.forEach(u => {
                const stats = grouped[u.id];
                const initial = (u.first_name || 'C').charAt(0).toUpperCase();
                grid.innerHTML += `
                    <div onclick="openCreatorLinksView('${u.id}')" class="glass-panel p-5 border border-slate-800 hover:border-indigo-500/60 cursor-pointer transition group">
                        <div class="flex items-center justify-between mb-4">
                            <div class="flex items-center space-x-3 truncate pr-2">
                                <div class="w-11 h-11 rounded-2xl btn-primary flex items-center justify-center text-white font-extrabold text-base shrink-0 shadow-lg">
                                    ${initial}
                                </div>
                                <div class="truncate">
                                    <div class="font-extrabold text-sm text-white group-hover:text-indigo-300 transition truncate">
                                        ${u.first_name || 'Creator'} ${u.username ? `<span class="text-xs text-slate-400 font-normal">@${u.username}</span>` : ''}
                                    </div>
                                    <div class="text-[10px] font-mono-code text-indigo-400">TG ID: ${u.telegram_id}</div>
                                </div>
                            </div>
                            <span class="bg-indigo-500/20 text-indigo-300 border border-indigo-500/30 px-2.5 py-1 rounded-xl text-xs font-extrabold font-mono-code shrink-0">
                                ${stats.count} ${stats.count === 1 ? 'Link' : 'Links'} <i class="fa-solid fa-chevron-right ml-1 text-[10px]"></i>
                            </span>
                        </div>
                        <div class="grid grid-cols-2 gap-2 pt-3 border-t border-slate-800/80 text-xs">
                            <div>
                                <span class="text-slate-400 text-[10px] block uppercase font-bold">Total Views</span>
                                <span class="font-mono-code font-extrabold text-white">${stats.views}</span>
                            </div>
                            <div class="text-right">
                                <span class="text-slate-400 text-[10px] block uppercase font-bold">Link Earnings</span>
                                <span class="font-mono-code font-extrabold text-emerald-400">$${stats.earnings.toFixed(4)}</span>
                            </div>
                        </div>
                    </div>`;
            });
        };

        window.openCreatorLinksView = function(userId) {
            selectedCreatorForLinks = allAdminUsers.find(u => String(u.id) === String(userId)) || { id: userId, first_name: 'Creator', telegram_id: '...' };
            document.getElementById('links-manager-creators-view').classList.add('hidden');
            document.getElementById('links-manager-detail-view').classList.remove('hidden');

            document.getElementById('selected-creator-title').innerText = `${selectedCreatorForLinks.first_name || 'Creator'}'s Shortened Links`;
            document.getElementById('selected-creator-subtitle').innerText = `TG ID: ${selectedCreatorForLinks.telegram_id} ${selectedCreatorForLinks.username ? '• @' + selectedCreatorForLinks.username : ''}`;
            filterSelectedCreatorLinks();
        };

        window.backToLinksCreatorsList = function() {
            selectedCreatorForLinks = null;
            pendingAdminLinkDeleteId = null;
            document.getElementById('links-manager-detail-view').classList.add('hidden');
            document.getElementById('links-manager-creators-view').classList.remove('hidden');
            renderLinksManagerCreators();
        };

        window.filterSelectedCreatorLinks = function() {
            if (!selectedCreatorForLinks) return;
            const q = (document.getElementById('admin-link-search')?.value || '').toLowerCase();
            const creatorLinks = allAdminLinks.filter(l => String(l.user_id) === String(selectedCreatorForLinks.id)).filter(l =>
                (l.short_id || '').toLowerCase().includes(q) ||
                (l.original_url || '').toLowerCase().includes(q)
            );
            renderSelectedCreatorLinksTable(creatorLinks);
        };

        function renderSelectedCreatorLinksTable(linksArr) {
            const tbody = document.getElementById('admin-links-list');
            if (!linksArr || linksArr.length === 0) {
                tbody.innerHTML = '<tr><td colspan="6" class="p-8 text-center text-slate-500">No links found for this creator.</td></tr>';
                return;
            }
            tbody.innerHTML = '';
            linksArr.forEach(l => {
                const isConfirming = pendingAdminLinkDeleteId === l.id;
                const dateStr = new Date(l.created_at).toLocaleDateString();
                tbody.innerHTML += `
                    <tr class="hover:bg-slate-900/50">
                        <td class="p-4 font-mono-code font-bold text-indigo-400">${l.short_id}</td>
                        <td class="p-4 max-w-xs truncate text-slate-300"><a href="${l.original_url}" target="_blank" class="hover:underline">${l.original_url}</a></td>
                        <td class="p-4 font-mono-code font-bold text-white">${l.clicks || 0}</td>
                        <td class="p-4 font-mono-code font-bold text-emerald-400">$${parseFloat(l.earnings || 0).toFixed(4)}</td>
                        <td class="p-4 text-slate-400">${dateStr}</td>
                        <td class="p-4 text-right">
                            <button onclick="adminDeleteSingleLink('${l.id}')" class="${isConfirming ? 'btn-danger text-white' : 'bg-rose-500/15 hover:bg-rose-500/25 text-rose-400'} px-3 py-1.5 rounded-lg text-xs font-extrabold transition">
                                ${isConfirming ? 'Confirm Delete?' : '<i class="fa-solid fa-trash-can mr-1"></i>Delete Link'}
                            </button>
                        </td>
                    </tr>`;
            });
        }

        // Owner Single Link Permanent Delete (2-Tap Confirmation)
        window.adminDeleteSingleLink = async function(linkId) {
            if (pendingAdminLinkDeleteId !== linkId) {
                pendingAdminLinkDeleteId = linkId;
                filterSelectedCreatorLinks();
                setTimeout(() => {
                    if (pendingAdminLinkDeleteId === linkId) {
                        pendingAdminLinkDeleteId = null;
                        filterSelectedCreatorLinks();
                    }
                }, 3500);
                return;
            }
            try {
                pendingAdminLinkDeleteId = null;
                await dbClient.from('click_logs').delete().eq('link_id', linkId);
                const { error } = await dbClient.from('links').delete().eq('id', linkId);
                if (error) throw error;
                allAdminLinks = allAdminLinks.filter(l => String(l.id) !== String(linkId));
                filterSelectedCreatorLinks();
                showAdminToast("Link permanently deleted by Owner!");
            } catch (e) {
                showAdminToast("Failed to delete link", true);
            }
        };

        // Owner Double-Confirmation Delete All Links (Supports Single Creator OR Entire Platform)
        window.openOwnerDeleteModal = function(mode) {
            adminDeleteMode = mode; // 'creator' or 'global'
            adminDeleteAllStep = 1;

            if (mode === 'creator' && selectedCreatorForLinks) {
                const cLinks = allAdminLinks.filter(l => String(l.user_id) === String(selectedCreatorForLinks.id));
                if (cLinks.length === 0) return showAdminToast("This creator has no links to delete!", true);
                document.getElementById('admin-del-step-badge').innerText = "Owner Confirmation 1 of 2";
                document.getElementById('admin-del-title').innerText = `Delete All ${cLinks.length} Links of ${selectedCreatorForLinks.first_name || 'Creator'}?`;
                document.getElementById('admin-del-desc').innerText = `First Check: Are you sure you want to permanently delete all ${cLinks.length} links belonging to ${selectedCreatorForLinks.first_name || 'this creator'}?`;
            } else {
                if (allAdminLinks.length === 0) return showAdminToast("No links on platform to delete!", true);
                document.getElementById('admin-del-step-badge').innerText = "Owner Confirmation 1 of 2";
                document.getElementById('admin-del-title').innerText = `Delete All ${allAdminLinks.length} Platform Links?`;
                document.getElementById('admin-del-desc').innerText = "First Check: Are you sure you want to permanently delete EVERY shortened link across all creators on the platform?";
            }

            document.getElementById('btn-admin-del-confirm').innerText = "Yes, Continue (1/2)";
            document.getElementById('admin-del-all-modal').classList.remove('hidden');
        };

        window.closeAdminDeleteAllModal = function() {
            adminDeleteAllStep = 0;
            document.getElementById('admin-del-all-modal').classList.add('hidden');
        };

        window.advanceAdminDeleteAll = async function() {
            if (adminDeleteAllStep === 1) {
                adminDeleteAllStep = 2;
                document.getElementById('admin-del-step-badge').innerText = "Final Owner Confirmation 2 of 2";
                document.getElementById('admin-del-title').innerText = "Permanent Owner Wipe Warning!";
                if (adminDeleteMode === 'creator' && selectedCreatorForLinks) {
                    document.getElementById('admin-del-desc').innerText = `Second & Final Check: All links and click logs for ${selectedCreatorForLinks.first_name || 'this creator'} will be permanently erased. Confirm permanent deletion?`;
                } else {
                    document.getElementById('admin-del-desc').innerText = "Second & Final Check: All links and click logs across the entire platform will be permanently erased. Confirm permanent deletion?";
                }
                document.getElementById('btn-admin-del-confirm').innerText = "Permanently Delete All (2/2)";
                return;
            }

            if (adminDeleteAllStep === 2) {
                const btn = document.getElementById('btn-admin-del-confirm');
                btn.disabled = true;
                btn.innerText = "Deleting...";
                try {
                    if (adminDeleteMode === 'creator' && selectedCreatorForLinks) {
                        const targetIds = allAdminLinks.filter(l => String(l.user_id) === String(selectedCreatorForLinks.id)).map(l => l.id);
                        if (targetIds.length > 0) {
                            await dbClient.from('click_logs').delete().in('link_id', targetIds);
                            await dbClient.from('links').delete().eq('user_id', selectedCreatorForLinks.id);
                        }
                        allAdminLinks = allAdminLinks.filter(l => String(l.user_id) !== String(selectedCreatorForLinks.id));
                        closeAdminDeleteAllModal();
                        backToLinksCreatorsList();
                        showAdminToast("All links for this creator permanently deleted!");
                    } else {
                        await dbClient.from('click_logs').delete().neq('id', 0);
                        await dbClient.from('links').delete().neq('id', 0);
                        allAdminLinks = [];
                        closeAdminDeleteAllModal();
                        renderLinksManagerCreators();
                        showAdminToast("All platform links permanently deleted by Owner!");
                    }
                } catch (e) {
                    showAdminToast("Error deleting links", true);
                } finally {
                    btn.disabled = false;
                }
            }
        };

        // --- TAB 4: WITHDRAWALS ---
        async function loadWithdrawals() {
            const tbody = document.getElementById('admin-withdraw-list');
            const filter = document.getElementById('admin-withdraw-filter')?.value || 'all';
            try {
                const { data } = await dbClient.from('withdrawals').select('*').order('created_at', { ascending: false });
                const filtered = (data || []).filter(w => filter === 'all' ? true : w.status === filter);
                if (filtered.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="5" class="p-8 text-center text-slate-500">No matching withdrawal requests.</td></tr>';
                    return;
                }

                tbody.innerHTML = '';
                filtered.forEach(w => {
                    const dateStr = new Date(w.created_at).toLocaleDateString();
                    let actionHtml = '';
                    if (w.status === 'pending') {
                        actionHtml = `
                            <button onclick="processWithdrawal('${w.id}', '${w.user_id}', ${w.amount}, 'approved')" class="btn-emerald px-3 py-1.5 rounded-lg text-white text-xs font-bold mr-1.5">Approve</button>
                            <button onclick="processWithdrawal('${w.id}', '${w.user_id}', ${w.amount}, 'rejected')" class="btn-danger px-3 py-1.5 rounded-lg text-white text-xs font-bold">Reject & Refund</button>
                        `;
                    } else {
                        const badgeCls = w.status === 'approved' ? 'bg-emerald-500/15 text-emerald-400 border-emerald-500/30' : 'bg-rose-500/15 text-rose-400 border-rose-500/30';
                        actionHtml = `<span class="${badgeCls} border px-2.5 py-1 rounded-md font-bold text-[10px] uppercase">${w.status}</span>`;
                    }

                    tbody.innerHTML += `
                        <tr class="hover:bg-slate-900/50">
                            <td class="p-4 font-bold text-indigo-300">${w.username || String(w.user_id).substring(0, 8)}</td>
                            <td class="p-4"><b>${w.method}</b><br><span class="text-slate-400 font-mono-code select-all">${w.details}</span></td>
                            <td class="p-4 font-extrabold text-emerald-400 font-mono-code text-sm">$${parseFloat(w.amount).toFixed(2)}</td>
                            <td class="p-4 text-slate-400">${dateStr}</td>
                            <td class="p-4 text-center">${actionHtml}</td>
                        </tr>`;
                });
            } catch (e) {}
        }

        window.processWithdrawal = async function(wId, userId, amount, newStatus) {
            if (!confirm(`Mark this withdrawal as ${newStatus.toUpperCase()}?`)) return;
            try {
                await dbClient.from('withdrawals').update({ status: newStatus }).eq('id', wId);
                if (newStatus === 'rejected') {
                    const { data: uRows } = await dbClient.from('users').select('balance').eq('id', userId).limit(1);
                    if (uRows && uRows[0]) {
                        await dbClient.from('users').update({ balance: parseFloat(uRows[0].balance || 0) + parseFloat(amount) }).eq('id', userId);
                    }
                }
                showAdminToast(`Withdrawal ${newStatus}!`);
                loadWithdrawals();
            } catch (e) {
                showAdminToast("Error updating withdrawal", true);
            }
        };

        // --- TAB 5: SETTINGS (1 TO 20 ADS = $1 TO $20 CPM SYNCHRONIZER) ---
        window.syncAdminAdCpm = function(val) {
            const tier = Math.max(1, Math.min(20, parseInt(val || 1, 10)));
            const sel = document.getElementById('set-ads');
            const cpmInp = document.getElementById('set-cpm');
            const prev = document.getElementById('admin-auto-cpm-preview');
            if (sel) sel.value = tier;
            if (cpmInp) cpmInp.value = tier;
            if (prev) prev.innerText = `$${tier.toFixed(2)}`;
        };

        async function loadSettings() {
            const sel = document.getElementById('set-ads');
            if (sel) {
                sel.innerHTML = '';
                for (let i = 1; i <= 20; i++) {
                    const opt = document.createElement('option');
                    opt.value = i;
                    opt.innerText = `${i} ${i === 1 ? 'Ad' : 'Ads'}  ➔  Automatically Sets $${i.toFixed(2)} CPM`;
                    sel.appendChild(opt);
                }
            }
            try {
                const { data: rows } = await dbClient.from('settings').select('*').limit(1);
                const data = rows && rows[0];
                if (data) {
                    settingsId = data.id;
                    const tier = Math.max(1, Math.min(20, parseInt(data.ads_per_link || data.cpm || 1, 10)));
                    syncAdminAdCpm(tier);
                    document.getElementById('set-ref').value = data.refer_percent || 10;
                    document.getElementById('set-timer').value = data.ad_timer || 5;
                    document.getElementById('set-payments').value = data.payment_methods || 'UPI, PayPal, USDT (TRC20)';
                    document.getElementById('set-min-with').value = data.min_withdraw || 5;
                    document.getElementById('set-tg').value = data.tg_channel_url || '';
                    document.getElementById('set-yt').value = data.yt_channel_url || '';
                    document.getElementById('set-privacy').value = data.privacy_url || '';
                    document.getElementById('set-terms').value = data.terms_url || '';
                    document.getElementById('set-maintenance').checked = data.maintenance_mode || false;
                } else {
                    syncAdminAdCpm(1);
                }
            } catch (e) {}
        }

        window.saveSettingsAction = async function() {
            const btn = document.getElementById('btn-save-settings');
            const originalHTML = btn.innerHTML;
            btn.innerHTML = `<i class="fa-solid fa-spinner fa-spin mr-2"></i> Saving...`;

            const syncedTier = Math.max(1, Math.min(20, parseInt(document.getElementById('set-ads').value || 1, 10)));
            const updates = {
                ads_per_link: syncedTier,
                cpm: syncedTier * 1.0,
                refer_percent: parseInt(document.getElementById('set-ref').value) || 10,
                ad_timer: parseInt(document.getElementById('set-timer').value) || 5,
                payment_methods: document.getElementById('set-payments').value,
                min_withdraw: parseFloat(document.getElementById('set-min-with').value) || 5,
                tg_channel_url: document.getElementById('set-tg').value,
                yt_channel_url: document.getElementById('set-yt').value,
                privacy_url: document.getElementById('set-privacy').value,
                terms_url: document.getElementById('set-terms').value,
                maintenance_mode: document.getElementById('set-maintenance').checked
            };

            try {
                if (settingsId) await dbClient.from('settings').update(updates).eq('id', settingsId);
                else await dbClient.from('settings').insert([updates]);
                showAdminToast(`Saved! Active Tier: ${syncedTier} Ads = $${syncedTier}.00 CPM`);
            } catch (e) {
                showAdminToast("Error saving settings", true);
            }
            btn.innerHTML = originalHTML;
        };

        // --- TAB 6: BROADCAST ---
        window.updatePreview = function() {
            const img = document.getElementById('bc-image')?.value || '';
            const text = document.getElementById('bc-caption')?.value || 'Broadcast message preview...';
            const showBtn = document.getElementById('bc-btn-toggle')?.checked;

            const pImg = document.getElementById('prev-img');
            if (img) { pImg.src = img; pImg.classList.remove('hidden'); } else { pImg.classList.add('hidden'); }
            document.getElementById('prev-text').innerHTML = text.replace(/\n/g, '<br>');
            if (showBtn) document.getElementById('prev-btn').classList.remove('hidden'); else document.getElementById('prev-btn').classList.add('hidden');
        };

        window.startBroadcast = async function() {
            const btn = document.getElementById('btn-send-broadcast');
            const imgUrl = document.getElementById('bc-image').value.trim();
            const caption = document.getElementById('bc-caption').value;
            const useBtn = document.getElementById('bc-btn-toggle').checked;
            const miniAppUrl = document.getElementById('bc-mini-app-url').value.trim();

            if (!caption && !imgUrl) return showAdminToast("Add an image or message caption!", true);
            if (!confirm("Send broadcast to ALL registered users?")) return;

            btn.disabled = true;
            btn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin mr-2"></i> Broadcasting...';
            document.getElementById('bc-status').classList.remove('hidden');

            try {
                const { data: users } = await dbClient.from('users').select('telegram_id').not('telegram_id', 'is', null);
                if (!users || users.length === 0) throw new Error("No users found.");

                const chatIds = users.map(u => u.telegram_id);
                const total = chatIds.length;
                let sent = 0, failed = 0;

                const chunkSize = 25;
                for (let i = 0; i < total; i += chunkSize) {
                    const chunk = chatIds.slice(i, i + chunkSize);
                    const response = await fetch(VERCEL_BROADCAST_API, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ chat_ids: chunk, image_url: imgUrl, caption: caption, use_button: useBtn, mini_app_url: miniAppUrl })
                    });
                    if (response.ok) {
                        const result = await response.json();
                        sent += result.sent || 0;
                        failed += result.failed || 0;
                    } else {
                        failed += chunk.length;
                    }

                    const processed = Math.min(i + chunkSize, total);
                    const percent = Math.round((processed / total) * 100);
                    document.getElementById('bc-percent').innerText = `${percent}%`;
                    document.getElementById('bc-count').innerText = `${processed} / ${total}`;
                    document.getElementById('bc-bar').style.width = `${percent}%`;
                    document.getElementById('bc-sent').innerText = sent;
                    document.getElementById('bc-failed').innerText = failed;
                }
                showAdminToast(`Broadcast Complete! Sent: ${sent}`);
            } catch (e) {
                showAdminToast("Error: " + e.message, true);
            }
            btn.disabled = false;
            btn.innerHTML = '<i class="fa-solid fa-paper-plane mr-2"></i> Send Broadcast to All Users';
        };
    </script>
</body>
